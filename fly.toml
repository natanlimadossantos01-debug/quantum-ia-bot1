app = "quantum-ia-bot1-tjhoqq"
primary_region = "gru"
kill_signal = "SIGINT"
kill_timeout = 5

[build]
  builder = "paketobuildpacks/builder:base"

[env]
  TELEGRAM_TOKEN = ""
  TELEGRAM_CHAT_ID = ""
  IQ_EMAIL = ""
  IQ_SENHA = ""

[[services]]
  protocol = "tcp"
  internal_port = 8080
  auto_stop_machines = false
  auto_start_machines = false
  min_machines_running = 1

  [[services.ports]]
    handlers = ["tcp"]
    port = 8080

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
